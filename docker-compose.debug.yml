services:
  db:
    image: postgres:16
    container_name: postgres_debug
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_debug_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      target: dev
    container_name: django_debug
    command: >
      gunicorn app.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --threads 4
      --timeout 120
      --reload
      --log-level debug

    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
      - .env
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: 1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: media
      AWS_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio

  public_frontend:
    build:
      context: ./public_frontend
      target: dev
    container_name: public_nextjs_debug
    command: npm run dev
    volumes:
      - ./public_frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./public_frontend/.env.local
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/media || true &&
      mc anonymous set public local/media &&
      echo '✅ MinIO inicializado'
      "
    restart: "no"


volumes:
  postgres_debug_data:
  node_modules:
  minio_data:
